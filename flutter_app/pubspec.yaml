name: geuneul
description: "여름 그늘길 경로 안내 모바일 앱"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  google_maps_flutter: ^2.5.0
  google_places_flutter: ^3.0.8
  cupertino_icons: ^1.0.2

  # HTTP
  http: ^1.1.0
  dio: ^5.4.0

  # JSON
  json_serializable: ^6.7.1
  json_annotation: ^4.8.1

  # 상태 관리
  provider: ^6.1.0
  get: ^4.6.5

  # 유틸리티
  intl: ^0.19.0
  geolocator: ^10.0.0
  permission_handler: ^11.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: NotoSansKR
      fonts:
        - asset: assets/fonts/NotoSansKR-Regular.ttf
        - asset: assets/fonts/NotoSansKR-Bold.ttf
          weight: 700
