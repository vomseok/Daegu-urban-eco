<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>그늘로 - 여름 그늘길 경로 안내</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: white;
            padding: 12px 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            z-index: 100;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 12px;
        }

        .search-bar {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .search-group {
            flex: 1;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .search-input {
            flex: 1;
            padding: 10px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .search-input.start::before {
            content: '📍 ';
        }

        .time-selector {
            display: flex;
            gap: 6px;
        }

        .time-btn {
            padding: 8px 12px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            transition: all 0.3s;
        }

        .time-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .time-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .search-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .main-content {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        #map {
            flex: 1;
            z-index: 1;
        }

        .result-panel {
            width: 320px;
            background: white;
            box-shadow: -2px 0 8px rgba(0, 0, 0, 0.1);
            overflow-y: auto;
            padding: 20px;
            display: none;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
        }

        .result-panel.show {
            display: flex;
        }

        .result-header {
            color: #333;
            font-weight: 700;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .result-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .result-label {
            font-size: 12px;
            color: #999;
            font-weight: 600;
            text-transform: uppercase;
        }

        .result-value {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
        }

        .shade-score-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            margin-top: 4px;
            overflow: hidden;
        }

        .shade-score-fill {
            height: 100%;
            background: linear-gradient(90deg, #FFB74D 0%, #FFA726 100%);
            border-radius: 4px;
        }

        .chart-section {
            border-top: 1px solid #e0e0e0;
            padding-top: 15px;
        }

        .chart-title {
            font-weight: 600;
            margin-bottom: 12px;
            color: #333;
            font-size: 14px;
        }

        .chart-bars {
            display: flex;
            gap: 6px;
            align-items: flex-end;
            justify-content: space-between;
            height: 80px;
        }

        .bar {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            flex: 1;
        }

        .bar-fill {
            width: 100%;
            max-width: 24px;
            background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
            border-radius: 2px 2px 0 0;
        }

        .bar-label {
            font-size: 10px;
            color: #999;
        }

        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            font-weight: 600;
        }

        .error {
            display: none;
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
        }

        @media (max-width: 768px) {
            .result-panel {
                width: 100%;
                height: 40%;
                border-radius: 12px 12px 0 0;
                position: absolute;
                bottom: 0;
                left: 0;
                right: 0;
            }

            .search-bar {
                flex-direction: column;
                gap: 10px;
            }

            .time-selector {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <div class="logo">☀️ 그늘로</div>
            <div class="search-bar">
                <div class="search-group">
                    <input type="text" id="start" class="search-input start" placeholder="출발지 입력" value="대구역">
                    <input type="text" id="end" class="search-input" placeholder="목적지 입력" value="동인동">
                    <div class="time-selector">
                        <button type="button" class="time-btn" data-hour="9">9시</button>
                        <button type="button" class="time-btn active" data-hour="12">12시</button>
                        <button type="button" class="time-btn" data-hour="15">15시</button>
                        <button type="button" class="time-btn" data-hour="18">18시</button>
                    </div>
                </div>
                <button class="search-btn" onclick="findRoute()">경로 찾기</button>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div id="map"></div>

        <div class="result-panel" id="result-panel">
            <div class="result-header">✅ 경로를 찾았습니다!</div>

            <div class="result-item">
                <div class="result-label">거리</div>
                <div class="result-value" id="distance">-</div>
            </div>

            <div class="result-item">
                <div class="result-label">소요시간</div>
                <div class="result-value" id="duration">-</div>
            </div>

            <div class="result-item">
                <div class="result-label">그늘 점수</div>
                <div class="result-value" id="shade">-</div>
                <div class="shade-score-bar">
                    <div class="shade-score-fill" id="shade-bar"></div>
                </div>
            </div>

            <div class="chart-section">
                <div class="chart-title">📊 하루 그늘 예보</div>
                <div class="chart-bars" id="chart-bars"></div>
            </div>

            <div class="error" id="error"></div>
            <div class="loading" id="loading">검색 중...</div>
        </div>
    </div>

    <script>
        let selectedHour = 12;
        let map;
        let startMarker, endMarker, routeLine;

        // 지도 초기화
        function initMap() {
            if (map) return;
            map = L.map('map').setView([35.87, 128.60], 14);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors',
                maxZoom: 19
            }).addTo(map);
        }

        // 지도에 경로 표시
        function updateMapWithRoute(routeData) {
            console.log('updateMapWithRoute called with:', routeData);
            if (!map) initMap();

            // 기존 마커와 경로 제거
            if (startMarker) map.removeLayer(startMarker);
            if (endMarker) map.removeLayer(endMarker);
            if (routeLine) map.removeLayer(routeLine);

            // 대구 좌표: 대구역 → 동인동
            const startLat = 35.87, startLng = 128.59;
            const endLat = 35.88, endLng = 128.60;
            console.log('Start:', startLat, startLng, 'End:', endLat, endLng);

            // 출발지 마커
            startMarker = L.circleMarker([startLat, startLng], {
                radius: 10,
                fillColor: '#4CAF50',
                color: '#2E7D32',
                weight: 3,
                opacity: 1,
                fillOpacity: 0.9
            }).addTo(map).bindPopup('📍 출발지', {closeButton: false});

            // 목적지 마커
            endMarker = L.circleMarker([endLat, endLng], {
                radius: 10,
                fillColor: '#FF5722',
                color: '#D84315',
                weight: 3,
                opacity: 1,
                fillOpacity: 0.9
            }).addTo(map).bindPopup('🎯 목적지', {closeButton: false});

            // 경로 폴리라인
            if (routeData.path && routeData.path.length > 0) {
                const pathCoords = routeData.path.map(p => [p.lat, p.lng]);
                console.log('Path coords:', pathCoords);
                routeLine = L.polyline(pathCoords, {
                    color: '#667eea',
                    weight: 5,
                    opacity: 0.8,
                    lineCap: 'round',
                    lineJoin: 'round'
                }).addTo(map);

                // 지도 자동 줌 (경로 포함)
                const bounds = routeLine.getBounds();
                console.log('Line bounds:', bounds);
                console.log('Bounds southwest:', bounds.getSouthWest());
                console.log('Bounds northeast:', bounds.getNorthEast());

                // 명시적으로 bounds 설정 (좌표 순서 확보)
                const sw = bounds.getSouthWest();
                const ne = bounds.getNorthEast();
                const safeBounds = L.latLngBounds([
                    [Math.min(sw.lat, ne.lat), Math.min(sw.lng, ne.lng)],
                    [Math.max(sw.lat, ne.lat), Math.max(sw.lng, ne.lng)]
                ]);
                console.log('Safe bounds:', safeBounds);

                map.fitBounds(safeBounds, {padding: [50, 50], maxZoom: 15});
            } else {
                // 마커만 있을 때 - 대구 지도에서 두 지점 보이기
                const bounds = L.latLngBounds([
                    [startLat, startLng],
                    [endLat, endLng]
                ]);
                map.fitBounds(bounds, {padding: [100, 100], maxZoom: 14});
            }
        }

        // 시간 버튼 선택
        document.querySelectorAll('.time-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedHour = parseInt(btn.dataset.hour);
                loadChart();
            });
        });

        // 차트 로드
        async function loadChart() {
            try {
                const response = await fetch('/api/shade-by-hour');

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();

                const bars = document.getElementById('chart-bars');
                bars.innerHTML = '';

                data.shade_by_hour.forEach(item => {
                    const height = Math.min(item.shade_score, 100);
                    const bar = document.createElement('div');
                    bar.className = 'bar';
                    bar.innerHTML = `
                        <div class="bar-fill" style="height: ${height}px;"></div>
                        <div class="bar-label">${item.hour}:00</div>
                    `;
                    bars.appendChild(bar);
                });
            } catch (e) {
                console.error('차트 로드 실패:', e);
            }
        }

        // 경로 찾기
        async function findRoute() {
            alert('경로 찾기 클릭됨!');
            console.log('=== findRoute 시작 ===');
            const startInput = document.getElementById('start').value;
            const endInput = document.getElementById('end').value;

            if (!startInput || !endInput) {
                showError('출발지와 목적지를 입력하세요');
                return;
            }

            document.getElementById('loading').style.display = 'block';
            document.getElementById('error').style.display = 'none';
            document.getElementById('result-panel').classList.add('show');

            try {
                // 테스트 경로 좌표 (대구역 → 동인동)
                const start = { lat: 35.87, lng: 128.59 };
                const end = { lat: 35.88, lng: 128.60 };

                const response = await fetch('/api/route', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        start: start,
                        end: end,
                        hour: selectedHour
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                console.log('API Response:', data);

                if (data.success) {
                    document.getElementById('distance').textContent =
                        (data.distance / 1000).toFixed(1) + ' km';
                    document.getElementById('duration').textContent =
                        data.duration_min.toFixed(0) + '분';
                    const shadeScore = data.avg_shade_score.toFixed(0);
                    document.getElementById('shade').textContent = shadeScore + '점';
                    document.getElementById('shade-bar').style.width = shadeScore + '%';
                    document.getElementById('result-panel').classList.add('show');
                    console.log('Calling updateMapWithRoute...');
                    updateMapWithRoute(data);
                } else {
                    showError(data.message || '경로를 찾을 수 없습니다');
                    initMap();
                }
            } catch (e) {
                console.error('Error:', e);
                showError('서버 연결 실패: ' + e.message);
                initMap();
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function showError(msg) {
            const errorEl = document.getElementById('error');
            errorEl.textContent = msg;
            errorEl.style.display = 'block';
        }

        // 페이지 로드 시 차트와 지도 표시
        loadChart();
        initMap();
    </script>
</body>
</html>
