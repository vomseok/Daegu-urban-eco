<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>그늘로 - 여름 그늘길</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

        .wrapper { display: flex; height: 100vh; flex-direction: column; }

        .top { background: white; padding: 20px; border-bottom: 1px solid #ddd; }
        .title { font-size: 28px; font-weight: 700; color: #667eea; margin-bottom: 15px; }

        .controls { display: flex; gap: 10px; align-items: center; }
        input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
        button { padding: 12px 24px; background: #667eea; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 14px; }
        button:hover { background: #5568d3; }

        .middle { display: flex; flex: 1; gap: 0; overflow: hidden; }
        #map { flex: 1; background: #e0e6f6; }

        .right { width: 340px; background: white; padding: 20px; overflow-y: auto; border-left: 1px solid #ddd; display: none; }
        .right.show { display: block; }

        .result-title { font-size: 18px; font-weight: 700; color: #333; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 2px solid #667eea; }

        .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .stat-box { background: #f5f5f5; padding: 12px; border-radius: 6px; text-align: center; }
        .stat-val { font-size: 22px; font-weight: 700; color: #667eea; }
        .stat-lbl { font-size: 11px; color: #999; margin-top: 4px; text-transform: uppercase; }

        .shade-bar-container { margin-bottom: 20px; }
        .shade-bar-label { font-size: 12px; color: #666; font-weight: 600; margin-bottom: 6px; }
        .shade-bar { width: 100%; height: 12px; background: #e0e0e0; border-radius: 6px; overflow: hidden; }
        .shade-bar-fill { height: 100%; background: linear-gradient(90deg, #4CAF50 0%, #FFA726 50%, #FF5722 100%); }

        .chart-section { margin-top: 20px; padding-top: 20px; border-top: 1px solid #eee; }
        .chart-title { font-size: 14px; font-weight: 600; color: #333; margin-bottom: 12px; }
        .chart-bars { display: flex; gap: 4px; align-items: flex-end; height: 70px; }
        .chart-bar { flex: 1; background: linear-gradient(180deg, #667eea 0%, #764ba2 100%); border-radius: 2px 2px 0 0; min-height: 4px; }
        .chart-bar-label { font-size: 9px; color: #999; text-align: center; margin-top: 4px; }

        .loading { color: #667eea; text-align: center; padding: 20px; display: none; }
        .loading.show { display: block; }

        .error { background: #fee; color: #c33; padding: 12px; border-radius: 6px; margin-bottom: 16px; font-size: 13px; border-left: 4px solid #c33; display: none; }
        .error.show { display: block; }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="top">
            <div class="title">☀️ 그늘로</div>
            <div class="controls">
                <input type="text" id="start" placeholder="출발지" value="대구역">
                <input type="text" id="end" placeholder="목적지" value="동인동">
                <select id="hour" style="padding: 12px; border: 1px solid #ddd; border-radius: 4px;">
                    <option value="9">9시</option>
                    <option value="12" selected>12시</option>
                    <option value="15">15시</option>
                    <option value="18">18시</option>
                </select>
                <button onclick="clickSearch()">경로 찾기</button>
            </div>
        </div>

        <div class="middle">
            <div id="map"></div>
            <div class="right" id="panel">
                <div class="error" id="error"></div>
                <div class="loading" id="loading">검색 중...</div>
                <div id="content" style="display: none;">
                    <div class="result-title">✅ 경로를 찾았습니다!</div>

                    <div class="stats">
                        <div class="stat-box">
                            <div class="stat-val" id="dist">-</div>
                            <div class="stat-lbl">거리</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-val" id="time">-</div>
                            <div class="stat-lbl">소요시간</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-val" id="shade">-</div>
                            <div class="stat-lbl">그늘점수</div>
                        </div>
                    </div>

                    <div class="shade-bar-container">
                        <div class="shade-bar-label">그늘 점수</div>
                        <div class="shade-bar">
                            <div class="shade-bar-fill" id="shadeFill"></div>
                        </div>
                    </div>

                    <div class="chart-section">
                        <div class="chart-title">📊 하루 그늘 예보</div>
                        <div class="chart-bars" id="chartBars"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let map = null;
        let routeLayer = null;

        function initMap() {
            if (map) return;
            map = L.map('map').setView([35.8756, 128.5953], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap',
                maxZoom: 19
            }).addTo(map);
        }

        function clearRoute() {
            if (routeLayer) {
                map.removeLayer(routeLayer);
                routeLayer = null;
            }
        }

        function drawRoute(path) {
            clearRoute();
            if (!path || path.length === 0) return;

            const coords = path.map(p => [p.lat, p.lng]);

            // 경로선
            routeLayer = L.polyline(coords, {
                color: '#667eea',
                weight: 5,
                opacity: 0.8
            }).addTo(map);

            // 출발지
            L.circleMarker(coords[0], {
                radius: 10,
                fillColor: '#4CAF50',
                color: '#2E7D32',
                weight: 2,
                opacity: 1,
                fillOpacity: 0.8
            }).addTo(map).bindPopup('출발지');

            // 도착지
            L.circleMarker(coords[coords.length - 1], {
                radius: 10,
                fillColor: '#FF5722',
                color: '#D84315',
                weight: 2,
                opacity: 1,
                fillOpacity: 0.8
            }).addTo(map).bindPopup('도착지');

            // 줌
            const bounds = L.latLngBounds(coords);
            map.fitBounds(bounds, { padding: [80, 80] });
        }

        async function clickSearch() {
            const panel = document.getElementById('panel');
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const content = document.getElementById('content');

            panel.classList.add('show');
            loading.classList.add('show');
            error.classList.remove('show');
            content.style.display = 'none';

            try {
                const hour = document.getElementById('hour').value;
                const response = await fetch('/api/route', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        start: { lat: 35.87, lng: 128.59 },
                        end: { lat: 35.88, lng: 128.60 },
                        hour: parseInt(hour)
                    })
                });

                const data = await response.json();

                if (!data.success) {
                    showError('경로를 찾을 수 없습니다');
                    return;
                }

                // 지도
                drawRoute(data.path);

                // 정보
                document.getElementById('dist').innerText = (data.distance / 1000).toFixed(1) + ' km';
                document.getElementById('time').innerText = Math.round(data.duration_min) + '분';
                const shadeVal = Math.round(data.avg_shade_score);
                document.getElementById('shade').innerText = shadeVal + '점';
                document.getElementById('shadeFill').style.width = Math.min(shadeVal, 100) + '%';

                content.style.display = 'block';
            } catch (e) {
                showError('오류: ' + e.message);
            } finally {
                loading.classList.remove('show');
            }
        }

        function showError(msg) {
            const error = document.getElementById('error');
            error.innerText = msg;
            error.classList.add('show');
        }

        async function loadChart() {
            try {
                const response = await fetch('/api/shade-by-hour');
                const data = await response.json();
                const bars = document.getElementById('chartBars');
                bars.innerHTML = '';

                const maxShade = Math.max(...data.shade_by_hour.map(x => x.shade_score));
                data.shade_by_hour.forEach(item => {
                    const height = Math.max(4, (item.shade_score / maxShade) * 60);
                    const barDiv = document.createElement('div');
                    barDiv.style.display = 'flex';
                    barDiv.style.flexDirection = 'column';
                    barDiv.style.alignItems = 'center';
                    barDiv.innerHTML = `
                        <div class="chart-bar" style="height: ${height}px;"></div>
                        <div class="chart-bar-label">${item.hour}</div>
                    `;
                    bars.appendChild(barDiv);
                });
            } catch (e) {
                console.error('Chart error:', e);
            }
        }

        window.addEventListener('load', () => {
            initMap();
            loadChart();
        });
    </script>
</body>
</html>
